services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nursery
      POSTGRES_PASSWORD: nursery_local
      POSTGRES_DB: nursery
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nursery -d nursery']
      interval: 2s
      timeout: 5s
      retries: 20
volumes:
  postgres-data:
